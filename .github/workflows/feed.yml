name: Update exploit feed

# Keeps feed/vuln_feed.json current: pulls recent CVEs from public sources and
# merges your hand-written entries from feed/manual.json. The app's in-app
# "Update" button downloads the published result.

on:
  schedule:
    - cron: "17 6 * * *"        # daily at 06:17 UTC
  workflow_dispatch: {}          # run on demand from the Actions tab
  push:
    branches: [ main ]
    paths:
      - "feed/manual.json"       # republish immediately when you add an entry
      - "tools/build_feed.py"

permissions:
  contents: write                # allow the job to commit the regenerated feed

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 40          # full-history pull across many products; never let a throttled NVD hang it
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed (auto-pull + merge manual entries)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional; raises NVD's rate limit
        run: |
          python3 tools/build_feed.py \
            --merge feed/manual.json \
            --out feed/vuln_feed.json \
            --min-entries 1 \
            ${NVD_API_KEY:+--nvd-key "$NVD_API_KEY"}

      - name: Bake the feed in as the app's offline seed
        # The seed ships inside the APK so a fresh install has the full DB with no network.
        # aapt stores res/raw/*.json DEFLATE-compressed, so the APK only grows by the compressed size.
        run: |
          cp feed/vuln_feed.json app/src/main/res/raw/vuln_seed.json
          echo "Seed entries: $(python3 -c "import json;print(len(json.load(open('app/src/main/res/raw/vuln_seed.json'))['vulns']))")"

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- feed/vuln_feed.json app/src/main/res/raw/vuln_seed.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name  "sentinel-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed/vuln_feed.json app/src/main/res/raw/vuln_seed.json
          git commit -m "chore(feed): refresh vuln DB + baked seed [skip ci]"
          git push
